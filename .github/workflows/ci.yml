name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `prisma generate` and module load read this; nothing here connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm ci`, not `npm install`: with no lockfile to follow, npm 10's resolver
      # crashes on these dependencies. Also runs `prisma generate`.
      - id: install
        run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      # The rest run even if an earlier check fails, so one push shows them all,
      # but not after a failed install, where each would only say "not found".
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:client-leak
